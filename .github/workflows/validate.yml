name: Test and Build NameForge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium

      - name: Run regression tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Audit 25-locale visible-content coverage
        run: npm run audit:i18n -- --json > localization-coverage-audit.json

      - name: Upload localization coverage report
        uses: actions/upload-artifact@v4
        with:
          name: localization-coverage-audit
          path: localization-coverage-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Audit visible and functional choice controls
        run: npm run test:visual

      - name: Upload visual QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-report
          path: artifacts/visual-qa/report.json
          if-no-files-found: warn
          retention-days: 30
