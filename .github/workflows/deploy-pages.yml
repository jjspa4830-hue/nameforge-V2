name: Deploy NameForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium

      - name: Run regression tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Audit visible and functional choice controls
        run: npm run test:visual

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-visual-audit:
    name: Inspect the published public site
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for live browser audit
        run: npx playwright install --with-deps chromium

      - name: Check published pages and interactive choice controls
        run: npm run test:visual
        env:
          VISUAL_QA_BASE_URL: https://jjspa4830-hue.github.io/nameforge-V2/

      - name: Save screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-public-visual-audit
          path: artifacts/visual-qa/
          if-no-files-found: warn
          retention-days: 14
